<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <!-- wp-dansal Plugin Banner - 1544x500 -->
  <!-- Replace this SVG with your actual plugin banner -->
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="danceFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a5a78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a6b8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1544" height="500" fill="url(#bgGradient)"/>
  
  <!-- Decorative dance floor pattern (left side) -->
  <g transform="translate(100,100)">
    <rect x="0" y="0" width="200" height="200" fill="url(#danceFloor)" rx="10" ry="10"/>
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#6a8a9a" stroke-width="2" rx="10" ry="10"/>
    
    <!-- Dance floor lines -->
    <line x1="0" y1="50" x2="200" y2="50" stroke="#8ab4c8" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#8ab4c8" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="0" y1="150" x2="200" y2="150" stroke="#8ab4c8" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="50" y1="0" x2="50" y2="200" stroke="#8ab4c8" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="#8ab4c8" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="150" y1="0" x2="150" y2="200" stroke="#8ab4c8" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Dancers silhouette -->
    <circle cx="70" cy="80" r="15" fill="#4a6baf" opacity="0.7"/>
    <circle cx="130" cy="80" r="15" fill="#4a6baf" opacity="0.7"/>
    <ellipse cx="70" cy="120" rx="10" ry="25" fill="#4a6baf" opacity="0.7"/>
    <ellipse cx="130" cy="120" rx="10" ry="25" fill="#4a6baf" opacity="0.7"/>
    <line x1="70" y1="95" x2="70" y2="120" stroke="#4a6baf" stroke-width="3" opacity="0.7"/>
    <line x1="130" y1="95" x2="130" y2="120" stroke="#4a6baf" stroke-width="3" opacity="0.7"/>
    <line x1="60" y1="100" x2="80" y2="100" stroke="#4a6baf" stroke-width="3" opacity="0.7"/>
    <line x1="120" y1="100" x2="140" y2="100" stroke="#4a6baf" stroke-width="3" opacity="0.7"/>
  </g>
  
  <!-- Calendar icon (left-center) -->
  <g transform="translate(350,150)">
    <rect x="0" y="0" width="120" height="100" fill="#4a6baf" rx="8" ry="8"/>
    <rect x="0" y="0" width="120" height="16" fill="#3a5a78"/>
    
    <!-- Calendar grid -->
    <line x1="20" y1="24" x2="100" y2="24" stroke="#6a8a9a" stroke-width="1"/>
    <line x1="20" y1="44" x2="100" y2="44" stroke="#6a8a9a" stroke-width="1"/>
    <line x1="20" y1="64" x2="100" y2="64" stroke="#6a8a9a" stroke-width="1"/>
    <line x1="20" y1="84" x2="100" y2="84" stroke="#6a8a9a" stroke-width="1"/>
    <line x1="36" y1="24" x2="36" y2="90" stroke="#6a8a9a" stroke-width="1"/>
    <line x1="56" y1="24" x2="56" y2="90" stroke="#6a8a9a" stroke-width="1"/>
    <line x1="76" y1="24" x2="76" y2="90" stroke="#6a8a9a" stroke-width="1"/>
    <line x1="96" y1="24" x2="96" y2="90" stroke="#6a8a9a" stroke-width="1"/>
    
    <!-- Highlight today -->
    <circle cx="66" cy="54" r="14" fill="#e74c3c" opacity="0.3"/>
    <text x="66" y="58" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TODAY</text>
  </g>
  
  <!-- Map icon (right-center) -->
  <g transform="translate(1100,100)">
    <rect x="0" y="0" width="200" height="150" fill="#4a6baf" rx="8" ry="8"/>
    <rect x="10" y="10" width="180" height="130" fill="#6a8a9a" rx="4" ry="4"/>
    
    <!-- Map grid -->
    <line x1="10" y1="50" x2="190" y2="50" stroke="#8ab4c8" stroke-width="1"/>
    <line x1="10" y1="80" x2="190" y2="80" stroke="#8ab4c8" stroke-width="1"/>
    <line x1="10" y1="110" x2="190" y2="110" stroke="#8ab4c8" stroke-width="1"/>
    <line x1="50" y1="10" x2="50" y2="140" stroke="#8ab4c8" stroke-width="1"/>
    <line x1="100" y1="10" x2="100" y2="140" stroke="#8ab4c8" stroke-width="1"/>
    <line x1="150" y1="10" x2="150" y2="140" stroke="#8ab4c8" stroke-width="1"/>
    
    <!-- Map marker -->
    <path d="M100 75 C100 55 115 40 115 40 L115 25 C115 15 105 5 100 5 C95 5 85 15 85 25 L85 40 C85 40 100 55 100 75 Z" fill="#e74c3c"/>
    <circle cx="100" cy="40" r="6" fill="#c0392b"/>
    <line x1="100" y1="30" x2="100" y2="40" stroke="#fff" stroke-width="2"/>
  </g>
  
  <!-- Plugin Title -->
  <g transform="translate(500,200)">
    <text x="0" y="0" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="72" font-weight="bold">wp-dansal</text>
    <text x="0" y="60" text-anchor="middle" fill="#8ab4c8" font-family="Arial, sans-serif" font-size="28">Dance Events & Locations</text>
    <text x="0" y="100" text-anchor="middle" fill="#6a8a9a" font-family="Arial, sans-serif" font-size="20">Backed by dansal</text>
  </g>
  
  <!-- Music notes (decorative) -->
  <circle cx="400" cy="300" r="8" fill="#e74c3c" opacity="0.8"/>
  <line x1="400" y1="300" x2="400" y2="280" stroke="#e74c3c" stroke-width="3" opacity="0.8"/>
  
  <circle cx="1100" cy="300" r="8" fill="#e74c3c" opacity="0.8"/>
  <line x1="1100" y1="300" x2="1100" y2="280" stroke="#e74c3c" stroke-width="3" opacity="0.8"/>
</svg>
