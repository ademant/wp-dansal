<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Screenshot 1: Events Calendar -->
  <rect x="0" y="0" width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#2c3e50"/>
  <text x="60" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="20">wp-dansal - Events Calendar</text>
  
  <!-- Sidebar -->
  <rect x="0" y="60" width="200" height="740" fill="#ecf0f1"/>
  <text x="20" y="90" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">Filter by:</text>
  <rect x="20" y="110" width="160" height="30" fill="#fff" stroke="#bdc3c7" rx="3"/>
  <text x="25" y="130" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Date Range</text>
  <rect x="20" y="150" width="160" height="30" fill="#fff" stroke="#bdc3c7" rx="3"/>
  <text x="25" y="170" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Location</text>
  <rect x="20" y="190" width="160" height="30" fill="#fff" stroke="#bdc3c7" rx="3"/>
  <text x="25" y="210" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Tags</text>
  
  <!-- Main content - Calendar -->
  <rect x="220" y="80" width="960" height="600" fill="#fff" stroke="#bdc3c7"/>
  
  <!-- Calendar header -->
  <g transform="translate(240,100)">
    <rect x="0" y="0" width="920" height="40" fill="#3498db"/>
    <text x="20" y="26" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">September 2026</text>
    <rect x="800" y="5" width="30" height="30" fill="#2980b9" rx="3"/>
    <text x="815" y="25" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16">←</text>
    <rect x="840" y="5" width="30" height="30" fill="#2980b9" rx="3"/>
    <text x="855" y="25" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16">→</text>
    <text x="880" y="26" fill="#fff" font-family="Arial, sans-serif" font-size="12">Today</text>
  </g>
  
  <!-- Calendar days header -->
  <g transform="translate(240,150)">
    <text x="20" y="25" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Mon</text>
    <text x="120" y="25" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Tue</text>
    <text x="220" y="25" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Wed</text>
    <text x="320" y="25" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Thu</text>
    <text x="420" y="25" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Fri</text>
    <text x="520" y="25" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Sat</text>
    <text x="620" y="25" text-anchor="middle" fill="#e74c3c" font-family="Arial, sans-serif" font-size="12">Sun</text>
  </g>
  
  <!-- Calendar events -->
  <g transform="translate(240,180)">
    <!-- Day cells with events -->
    <rect x="0" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="50" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">1</text>
    
    <rect x="100" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="150" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">2</text>
    
    <!-- Event on day 3 -->
    <rect x="200" y="0" width="100" height="100" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="250" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">3</text>
    <rect x="205" y="35" width="90" height="16" fill="#3498db" rx="3"/>
    <text x="250" y="47" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">Salsa Night</text>
    <rect x="205" y="55" width="90" height="16" fill="#e74c3c" rx="3"/>
    <text x="250" y="67" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">Bachata Class</text>
    
    <rect x="300" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="350" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">4</text>
    
    <rect x="400" y="0" width="100" height="100" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="450" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">5</text>
    <rect x="405" y="35" width="90" height="20" fill="#2ecc71" rx="3"/>
    <text x="450" y="50" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">Tango Workshop</text>
    
    <rect x="500" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="550" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">6</text>
    
    <rect x="600" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="650" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">7</text>
  </g>
  
  <!-- More rows -->
  <g transform="translate(240,280)">
    <rect x="0" y="0" width="100" height="100" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="50" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">8</text>
    <rect x="5" y="35" width="90" height="20" fill="#9b59b6" rx="3"/>
    <text x="50" y="50" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">Dance Festival</text>
    
    <rect x="100" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="150" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">9</text>
    
    <rect x="200" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="250" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">10</text>
    
    <rect x="300" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="350" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">11</text>
    
    <rect x="400" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="450" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">12</text>
    
    <rect x="500" y="0" width="100" height="100" fill="#f8f9fa" stroke="#ecf0f1"/>
    <text x="550" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">13</text>
    <rect x="505" y="35" width="90" height="16" fill="#3498db" rx="3"/>
    <text x="550" y="47" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10">Latin Night</text>
    
    <rect x="600" y="0" width="100" height="100" fill="#fff" stroke="#ecf0f1"/>
    <text x="650" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">14</text>
  </g>
  
  <!-- Screenshot label -->
  <rect x="0" y="750" width="1200" height="50" fill="#2c3e50"/>
  <text x="600" y="780" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14">Screenshot 1: Events Calendar View</text>
</svg>
