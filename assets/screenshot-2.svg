<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Screenshot 2: Locations Map -->
  <rect x="0" y="0" width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#2c3e50"/>
  <text x="60" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="20">wp-dansal - Dance Locations Map</text>
  
  <!-- Sidebar -->
  <rect x="0" y="60" width="250" height="740" fill="#ecf0f1"/>
  <text x="20" y="90" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">Search Locations:</text>
  <rect x="20" y="110" width="210" height="30" fill="#fff" stroke="#bdc3c7" rx="3"/>
  <text x="25" y="130" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Enter address or name...</text>
  
  <text x="20" y="160" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">Filter by:</text>
  <rect x="20" y="180" width="210" height="30" fill="#fff" stroke="#bdc3c7" rx="3"/>
  <text x="25" y="200" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Dance Style</text>
  
  <text x="20" y="230" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">Locations List:</text>
  
  <!-- Location items in sidebar -->
  <g transform="translate(20,250)">
    <rect x="0" y="0" width="210" height="40" fill="#fff" stroke="#bdc3c7" rx="3"/>
    <text x="10" y="25" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Dance Studio Berlin</text>
    <text x="10" y="38" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10">Berlin, Germany</text>
    
    <rect x="0" y="45" width="210" height="40" fill="#fff" stroke="#bdc3c7" rx="3"/>
    <text x="10" y="60" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Salsa Club Paris</text>
    <text x="10" y="73" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10">Paris, France</text>
    
    <rect x="0" y="90" width="210" height="40" fill="#fff" stroke="#bdc3c7" rx="3"/>
    <text x="10" y="105" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Tango Milonga Buenos Aires</text>
    <text x="10" y="118" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10">Buenos Aires, Argentina</text>
    
    <rect x="0" y="135" width="210" height="40" fill="#3498db" stroke="#2980b9" rx="3"/>
    <text x="10" y="150" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Ballroom Academy London</text>
    <text x="10" y="163" fill="#ecf0f1" font-family="Arial, sans-serif" font-size="10">London, UK</text>
  </g>
  
  <!-- Main map area -->
  <rect x="260" y="80" width="920" height="680" fill="#e8f4f8" stroke="#bdc3c7"/>
  
  <!-- Map grid pattern -->
  <g transform="translate(260,80)">
    <defs>
      <pattern id="mapPattern" patternUnits="userSpaceOnUse" width="40" height="40">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a8d8ea" stroke-width="0.5"/>
        <path d="M 0 40 L 40 40 40 0" fill="none" stroke="#a8d8ea" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="920" height="680" fill="url(#mapPattern)" opacity="0.3"/>
    
    <!-- Map markers -->
    <g transform="translate(100,200)">
      <!-- Berlin -->
      <path d="M 0 -20 C 0 -30 10 -40 10 -40 L 10 -60 C 10 -70 0 -80 0 -80 C -10 -80 -10 -70 -10 -60 L -10 -40 C -10 -40 0 -30 0 -20 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="0" cy="-40" r="8" fill="#c0392b"/>
      <line x1="0" y1="-60" x2="0" y2="-40" stroke="#fff" stroke-width="2"/>
      <text x="0" y="-90" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Dance Studio Berlin</text>
      <text x="0" y="-102" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="9">3 events</text>
    </g>
    
    <g transform="translate(400,250)">
      <!-- Paris -->
      <path d="M 0 -20 C 0 -30 10 -40 10 -40 L 10 -60 C 10 -70 0 -80 0 -80 C -10 -80 -10 -70 -10 -60 L -10 -40 C -10 -40 0 -30 0 -20 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="0" cy="-40" r="8" fill="#c0392b"/>
      <line x1="0" y1="-60" x2="0" y2="-40" stroke="#fff" stroke-width="2"/>
      <text x="0" y="-90" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Salsa Club Paris</text>
      <text x="0" y="-102" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="9">5 events</text>
    </g>
    
    <g transform="translate(600,400)">
      <!-- London -->
      <path d="M 0 -20 C 0 -30 10 -40 10 -40 L 10 -60 C 10 -70 0 -80 0 -80 C -10 -80 -10 -70 -10 -60 L -10 -40 C -10 -40 0 -30 0 -20 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="0" cy="-40" r="8" fill="#c0392b"/>
      <line x1="0" y1="-60" x2="0" y2="-40" stroke="#fff" stroke-width="2"/>
      <text x="0" y="-90" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Ballroom Academy London</text>
      <text x="0" y="-102" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="9">8 events</text>
    </g>
    
    <g transform="translate(200,450)">
      <!-- Buenos Aires -->
      <path d="M 0 -20 C 0 -30 10 -40 10 -40 L 10 -60 C 10 -70 0 -80 0 -80 C -10 -80 -10 -70 -10 -60 L -10 -40 C -10 -40 0 -30 0 -20 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="0" cy="-40" r="8" fill="#c0392b"/>
      <line x1="0" y1="-60" x2="0" y2="-40" stroke="#fff" stroke-width="2"/>
      <text x="0" y="-90" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Tango Milonga BA</text>
      <text x="0" y="-102" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="9">12 events</text>
    </g>
    
    <!-- Cluster marker -->
    <g transform="translate(700,150)">
      <circle cx="0" cy="0" r="25" fill="#3498db"/>
      <circle cx="0" cy="0" r="20" fill="#2980b9"/>
      <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">+3</text>
      <text x="0" y="-30" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">More locations</text>
    </g>
  </g>
  
  <!-- Map controls -->
  <g transform="translate(270,90)">
    <rect x="0" y="0" width="30" height="30" fill="#fff" stroke="#bdc3c7" rx="3"/>
    <text x="15" y="20" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="16">+</text>
    <rect x="0" y="35" width="30" height="30" fill="#fff" stroke="#bdc3c7" rx="3"/>
    <text x="15" y="55" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="16">−</text>
  </g>
  
  <!-- Screenshot label -->
  <rect x="0" y="750" width="1200" height="50" fill="#2c3e50"/>
  <text x="600" y="780" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14">Screenshot 2: Interactive Locations Map with Markers</text>
</svg>
