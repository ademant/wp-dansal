<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- wp-dansal Plugin Icon - 256x256 -->
  <!-- Replace this SVG with your actual plugin icon -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6baf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#gradient)" stroke="#2c3e50" stroke-width="4"/>
  
  <!-- Dance floor pattern -->
  <g transform="translate(64,64)">
    <rect x="0" y="0" width="128" height="128" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="16" y="16" width="96" height="96" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="32" y="32" width="64" height="64" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  
  <!-- Calendar icon (top-left) -->
  <rect x="48" y="48" width="40" height="32" fill="#fff" rx="2" ry="2"/>
  <rect x="48" y="48" width="40" height="6" fill="#4a6baf"/>
  <line x1="56" y1="60" x2="56" y2="76" stroke="#4a6baf" stroke-width="2"/>
  <line x1="64" y1="60" x2="64" y2="76" stroke="#4a6baf" stroke-width="2"/>
  <line x1="72" y1="60" x2="72" y2="76" stroke="#4a6baf" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="76" stroke="#4a6baf" stroke-width="2"/>
  
  <!-- Map marker icon (bottom-right) -->
  <path d="M192 112 C192 90 210 72 210 72 L210 56 C210 44 202 36 192 36 C182 36 174 44 174 56 L174 72 C174 72 192 90 192 112 Z" fill="#e74c3c"/>
  <circle cx="192" cy="72" r="8" fill="#c0392b"/>
  <line x1="192" y1="48" x2="192" y2="72" stroke="#fff" stroke-width="2"/>
  
  <!-- Music note (center-right) -->
  <circle cx="200" cy="100" r="4" fill="#fff"/>
  <line x1="200" y1="100" x2="200" y2="88" stroke="#fff" stroke-width="2"/>
  <line x1="196" y1="88" x2="204" y2="88" stroke="#fff" stroke-width="2"/>
  
  <!-- Event/location text indicator -->
  <text x="128" y="200" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">E</text>
  <text x="128" y="224" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16">L</text>
</svg>
